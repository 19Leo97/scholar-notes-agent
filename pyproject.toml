[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-notes-agent"
version = "0.1.0"
description = "Research agent that reasons over your personal notes and the scientific literature, with verifiable citations and token budgets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=0.2.60",
  "langchain-core>=0.3.30",
  "langchain-groq>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langchain-ollama>=0.2.0",
  "qdrant-client>=1.12.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "trafilatura>=1.12",
  "ddgs>=9.0",
  "python-dotenv>=1.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
rerank = ["fastembed>=0.4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
research = "scholar_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are tolerated; ruff format is not enforced

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the public internet (deselect with -m 'not network')"]
